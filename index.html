<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/img/pokeball.png" type="image/x-icon" />
    <title>Pokédex</title>

    <!-- Bootstrap CSS import -->
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.css" />
    <!-- Custom CSS import -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100" data-bs-theme="dark" onload="init()">
    <header>
      <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container-xxl">
          <h1 class="">
            <span> <img src="./assets/img/pokeball.png" alt="A closed Pokeball" class="img-fluid navbar-image" /> </span
            >Pokédex
          </h1>
          <button
            class="navbar-toggler"
            type="button"
            data-id="navbar-toggle-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarToggler"
            aria-controls="navbarToggler"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarToggler">
            <div class="d-flex ms-auto" role="search">
              <input
                class="form-control search-input"
                type="search"
                data-id="search-input"
                oninput="renderFilteredCards(this.value)"
                placeholder="Search"
                aria-label="Search"
              />
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main class="d-flex flex-column justify-content-center bg-body flex-grow-1" data-id="content">
      <section class="container d-flex flex-column align-items-center p-4 gap-4" data-id="content-cards">
        <div id="content-wrapper" class="d-flex justify-content-center align-items-center flex-wrap gap-3"></div>
        <button
          type="button"
          class="btn button-load bg-gradient mw-25"
          data-id="load-more-button"
          data-action="load-more"
          onclick="loadMorePokemons()"
          tabindex="0"
        >
          <span class="" data-id="button-load-text">Load more</span>
        </button>
      </section>
      <section id="dialog-wrapper" class="container">
        <dialog
          id="dialog"
          data-id="dialog"
          class="dialog bg-transparent border-0 p-0"
          closedby="any"
          onclose="removeBodyScrollLock()"
        ></dialog>
      </section>
      <section
      id="loading-spinner"
      data-id="loading-spinner"
      class="container d-flex justify-content-center align-items-center visually-hidden">
        <img src="./assets/img/pokeball-loading-spinner.png" alt="A spinning Pokeball" class="img-fluid loading-spinner-image w-50" />
      </section>
    </main>
    <footer class="bg-body-tertiary">
      <div class="container d-flex flex-column justify-content-center py-2 text-center">
        <span>Designed by</span>
        <b>Calvin Lamel</b>
        <span>Developer Akademie</span>
      </div>
    </footer>

    <!-- Bootstrap JavaScript import -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript import -->
    <script src="./scripts/template.js"></script>
    <script src="./scripts/api.js"></script>
    <script src="./scripts/utils.js"></script>
    <script src="./scripts/pokemon-service.js"></script>
    <script src="./scripts/render-cards.js"></script>
    <script src="./scripts/render-dialog.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
