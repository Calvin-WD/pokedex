<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <!-- Bootstrap CSS import -->
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Custom CSS import -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header>
      <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
        <div class="container-xxl">
          <a class="navbar-brand">Pokedéx</a>
          <button
            class="navbar-toggler"
            type="button"
            data-id="search-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarToggler"
            aria-controls="navbarToggler"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarToggler">
            <form class="d-flex ms-auto" role="search">
              <input
                class="form-control me-2"
                type="search"
                data-id="search-input"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-light" type="submit">Search</button>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main class="bg-black flex-grow-1">
      <section class="container p-4" data-id="content">
        <div class="d-flex justify-content-center align-items-center flex-wrap gap-3">
          <div class="card text-bg-dark card-width h-100">
            <div class="card-header d-flex flex-row-reverse justify-content-between align-items-center"><h5>Bulbasaur</h5> <h6>#1</h6></div>
            <div class="card-body bg-grass p-0" style="height: 300px;">
              <!-- <img src="assets\img\assy-pikachu-1774508_640.jpg" class="img-fluid card-picture" alt="..." /> -->
            </div>
            <div class="card-footer">This is some text within a card body.</div>
          </div>
        </div>
      </section>
    </main>
    <footer class="text-bg-dark">
      <div class="container-xxl d-flex justify-content-center text-center">
        <div class="row">
          <div class="col-12 col-sm-4">Copyright 2026</div>
          <div class="col-12 col-sm-4">Developer Akademie</div>
          <nav class="col-12 col-sm-4">
            <ul class="d-flex justify-content-center gap-3">
              <li>Insta</li>
              <li>Face</li>
              <li>Twitter</li>
            </ul>
          </nav>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JavaScript import -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
