<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex</title>

    <!-- Bootstrap CSS import -->
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Custom CSS import -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100" onload="init()">
    <header>
      <nav class="navbar navbar-expand-sm bg-dark" data-bs-theme="dark">
        <div class="container-xxl">
          <a class="navbar-brand">Pokedéx</a>
          <button
            class="navbar-toggler"
            type="button"
            data-id="navbar-toggle-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarToggler"
            aria-controls="navbarToggler"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarToggler">
            <form class="d-flex ms-auto" role="search">
              <input
                class="form-control me-2"
                type="search"
                data-id="search-input"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-light" type="submit" data-id="search-button">Search</button>
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main class="bg-black flex-grow-1">
      <section class="container d-flex flex-column align-items-center p-4 gap-4" data-id="content">
        <div id="content-wrapper" class="d-flex justify-content-center align-items-center flex-wrap gap-3"></div>
        <!-- <div class="d-flex justify-content-center align-items-center"> -->
        <button type="button" class="btn text-bg-dark w-25" data-id="load-more-button" data-action="load-more" onclick="loadMore()">
          Load more
        </button>
        <!-- </div> -->
      </section>
    </main>
    <footer class="text-bg-dark">
      <div class="container-xxl d-flex justify-content-center text-center">
        <div class="row">
          <div class="col-12 col-sm-4">Copyright 2026</div>
          <div class="col-12 col-sm-4">Developer Akademie</div>
          <nav class="col-12 col-sm-4">
            <ul class="d-flex justify-content-center gap-3">
              <li>Insta</li>
              <li>Face</li>
              <li>Twitter</li>
            </ul>
          </nav>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JavaScript import -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript import -->
    <script src="./scripts/template.js"></script>
    <script src="./scripts/apiservice.js"></script>
    <script src="./scripts/pokeapi.js"></script>
    <script src="./scripts/render.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
