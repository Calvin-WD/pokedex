<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" type="image/x-icon">
    <title>Pokedex</title>

    <!-- Bootstrap CSS import -->
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./node_modules/bootstrap-icons/font/bootstrap-icons.css" />
    <!-- Custom CSS import -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100" data-bs-theme="dark" onload="init()">
    <header>
      <nav class="navbar navbar-expand-sm bg-body-tertiary">
        <div class="container-xxl">
          <a class="navbar-brand">Pokedéx</a>
          <button
            class="navbar-toggler"
            type="button"
            data-id="navbar-toggle-button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarToggler"
            aria-controls="navbarToggler"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarToggler">
            <form class="d-flex ms-auto" role="search">
              <input
                class="form-control me-2"
                type="search"
                data-id="search-input"
                oninput="renderFilteredCards(this.value)"
                placeholder="Search"
                aria-label="Search"
              />
            </form>
          </div>
        </div>
      </nav>
    </header>
    <main class="bg-body flex-grow-1">
      <section class="container d-flex flex-column align-items-center p-4 gap-4" data-id="content">
        <div id="content-wrapper" class="d-flex justify-content-center align-items-center flex-wrap gap-3"></div>
        <button
          type="button"
          class="btn bg-gradient mw-25"
          data-id="load-more-button"
          data-action="load-more"
          onclick="loadMorePokemons()"
        >
          Load more
        </button>
      </section>
      <aside id="dialog-wrapper" class="container">
        <dialog id="dialog" class="border-0 bg-transparent" closedby="any" onclose="removeBodyScrollLock()"></dialog>
      </aside>
    </main>
    <footer class="bg-body-tertiary">
      <div class="container-xxl d-flex justify-content-center text-center">
        <div class="row">
          <div class="col-12 col-sm-4">Copyright 2026</div>
          <div class="col-12 col-sm-4">Developer Akademie</div>
          <nav class="col-12 col-sm-4">
            <ul class="d-flex justify-content-center gap-3">
              <li>Insta</li>
              <li>Face</li>
              <li>Twitter</li>
            </ul>
          </nav>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JavaScript import -->
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript import -->
    <script src="./scripts/template.js"></script>
    <script src="./scripts/api.js"></script>
    <script src="./scripts/utils.js"></script>
    <script src="./scripts/pokemon-service.js"></script>
    <script src="./scripts/render-cards.js"></script>
    <script src="./scripts/render-dialog.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
